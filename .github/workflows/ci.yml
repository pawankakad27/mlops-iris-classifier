name: MLOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8 pytest pytest-cov
      - name: Compile Python files
        run: python -m compileall -q src tests
      - name: Lint source and tests
        run: |
          python -m flake8 src/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E203,W292 \
            --statistics

  test-suite:
    name: test-suite
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
      - name: Generate Iris source data
        run: python src/generate_data.py
      - name: Collect Iris data
        run: |
          python src/pipeline/collect.py \
            --source data/raw/iris_v1.csv \
            --output data/raw/iris_raw.csv
      - name: Preprocess Iris data
        run: |
          python src/pipeline/preprocess.py \
            --input data/raw/iris_raw.csv \
            --output data/processed/iris_preprocessed.csv
      - name: Engineer features
        run: |
          python src/pipeline/features.py \
            --input data/processed/iris_preprocessed.csv \
            --output data/processed/iris_features.csv
      - name: Validate processed data
        run: |
          python src/pipeline/validate.py \
            --input data/processed/iris_features.csv
      - name: Run tests and generate reports
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml
      - name: Publish test and coverage report
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary = ["## Test and coverage report", ""]
          junit_path = Path("test-results.xml")
          if junit_path.exists():
              try:
                  root = ET.parse(junit_path).getroot()
              except ET.ParseError as error:
                  summary.extend([f"Could not read test results: `{error}`", ""])
              else:
                  cases = root.findall(".//testcase")
                  failures = [case for case in cases if case.find("failure") is not None]
                  errors = [case for case in cases if case.find("error") is not None]
                  skipped = [case for case in cases if case.find("skipped") is not None]
                  passed = len(cases) - len(failures) - len(errors) - len(skipped)
                  summary.extend([
                      "| Tests | Passed | Failed | Errors | Skipped |",
                      "| ---: | ---: | ---: | ---: | ---: |",
                      f"| {len(cases)} | {passed} | {len(failures)} | "
                      f"{len(errors)} | {len(skipped)} |",
                      "",
                  ])
                  for case in failures + errors:
                      result = case.find("failure")
                      if result is None:
                          result = case.find("error")
                      message = (result.get("message") or result.text or "").strip()
                      summary.append(f"- **{case.get('classname', '')}.{case.get('name', '')}**")
                      if message:
                          summary.append(f"  - {message.splitlines()[0]}")
                  if failures or errors:
                      summary.append("")
          else:
              summary.extend(["Test results were not generated (`test-results.xml` missing).", ""])

          coverage_path = Path("coverage.xml")
          if coverage_path.exists():
              try:
                  coverage_root = ET.parse(coverage_path).getroot()
              except ET.ParseError as error:
                  summary.extend([f"Could not read coverage results: `{error}`", ""])
              else:
                  line_rate = float(coverage_root.get("line-rate", "0")) * 100
                  summary.extend([f"**Line coverage:** {line_rate:.1f}%", ""])
          else:
              summary.extend(["Coverage report was not generated (`coverage.xml` missing).", ""])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n".join(summary) + "\n")
          PY
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  model-quality-gate:
    name: model-quality-gate
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Check model quality threshold
        run: python -m pytest tests/test_model_quality.py -v
